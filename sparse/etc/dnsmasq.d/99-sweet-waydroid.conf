# sweet: let Waydroid run its own dnsmasq alongside the system one.
#
# dnsmasq arrives as a dependency of waydroid - nothing in Sailfish itself
# requires it - and its service is enabled by default, binding the wildcard
# 0.0.0.0:53. Waydroid then starts a second instance for its container bridge
# and cannot bind:
#
#   dnsmasq: failed to create listening socket for 192.168.240.1:
#            Address already in use
#   Failed to setup waydroid-net.
#
# bind-interfaces makes the system instance bind each interface individually
# instead of the wildcard, leaving the container's address free. This is the
# option the Sailfish Waydroid packaging documents; the alternative is to
# disable the dnsmasq service outright, which also works since nothing else
# needs it.
#
# Dropped in here rather than edited into /etc/dnsmasq.conf because that file
# belongs to the dnsmasq package and already sets conf-dir=/etc/dnsmasq.d.
bind-interfaces
