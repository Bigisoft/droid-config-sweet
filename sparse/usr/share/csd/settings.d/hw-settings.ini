# Hardware feature declaration for sweet (Redmi Note 10 Pro).
# Read by libssusysinfo via /usr/share/csd/settings.d/*hw-settings*.ini and
# surfaced to the UI as DeviceInfo.hasFeature(). Without this file ssu-sysinfo
# reports only Feature_Suspend and Feature_Reboot, so anything gated on a
# feature silently disappears -- the battery indicator in lipstick's status area
# is "visible: deviceInfo.hasFeature(DeviceInfo.FeatureBattery)", which is why
# no battery was shown anywhere even though mce reported it correctly.
# Format and key names follow mer-hybris/droid-config-f5121.

[features]
# verified working on this port
Battery=1
LCD=1
Backlight=1
Touch=1
Wifi=1
UsbCharging=1
Key=1
ProxSensor=1
Loudspeaker=1
StereoLoudspeaker=1
Headset=1
AudioMic1=1
BackCamera=1
FrontCamera=1
# torch confirmed by driving /sys/class/leds/led:torch_0 and led:switch_0:
# battery draw rose from ~37 mA to ~105 mA and fell back when switched off
BackCameraFlash=1

# hardware is present and the stack is in place, not yet verified end to end
GSensor=1
Gyro=1
ECompass=1
LightSensor=1
Vibrator=1
Receiver=1
AudioMic2=1
SDCard=1
SIM=1
CellularData=1
CellularVoice=1
CellInfo=1
Bluetooth=1
GPS=1
UsbOtg=1
FmRadio=1

# known not working on this port yet
# The vendor publishes the AIDL fingerprint HAL
# (android.hardware.biometrics.fingerprint-V4-ndk.so) and no HIDL interface,
# while sailfish-fpd-community implements a HIDL client only. The sensor,
# its drivers and the vendor service all work; there is nothing on the
# Sailfish side that can talk to them.
Fingerprint=0

# hardware sweet does not have
# no front flash: CamX offers torch on every back-facing camera id and on
# neither front-facing one
FrontCameraFlash=0
LED=0
Hall=0
TOH=0
TouchAuto=0

[SIM]
# dual SIM: two qcrild instances run, and droid-configs-device ships
# ofono ril_subscription.d/dual-sim.conf
ModemCount=2

[Battery]
VoltageTest=False
