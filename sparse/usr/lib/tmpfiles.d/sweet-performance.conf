# sweet: where the Performance settings page leaves the chosen mode for
# sweet-performance-apply. Group-writable for sailfish-system (the user is in
# it); setgid so the mode file the user writes keeps that group.
d /var/lib/sweet-performance 2775 root sailfish-system -
# Root-only state of sweet-performance-apply (whether it forced mce's power
# saving mode on). Kept out of the directory above so the user cannot plant a
# symlink there for root to write through.
d /var/lib/sweet-performance-state 0700 root root -
