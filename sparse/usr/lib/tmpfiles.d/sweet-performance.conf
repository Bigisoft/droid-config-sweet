# sweet: where the Performance settings page leaves the chosen mode for
# sweet-performance-apply. Group-writable for sailfish-system (the user is in
# it); setgid so the mode file the user writes keeps that group. Root's own
# state is separate: StateDirectory=sweet-performance-state of the service.
# The spec's %post runs systemd-tmpfiles for this file, so it also exists
# right after an install without a reboot.
d /var/lib/sweet-performance 2775 root sailfish-system -
