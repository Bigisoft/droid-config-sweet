# sweet: point mce at the charge-control node that holds the battery idle.
#
# mce's charging module knows three candidate sysfs paths and picks
# battery_charging_enabled on this device, which does nothing here. Point it
# at charging_enabled instead.
#
# Measured on the device (2026-11-17) on a PC USB port charging at -1.3 A
# (battery/current_now negative = charging): writing 0 to charging_enabled made
# battery/current_now about 0 (+-2 mA) with status "Not charging", battery
# voltage and capacity flat for 9 minutes and bms/current_avg at 305 uA, while
# usb/input_current_now carried the phone's own 13-120 mA load. Writing 1
# resumed charging at -1.33 A at once, and nothing overwrote the value.
# So with charging_enabled=0 the charger powers the phone and the battery
# rests. An earlier note here said charging_enabled did nothing; that test
# misread a current of about -18 mA as still charging.
#
# input_suspend, used before, cuts the charger input entirely: a paused phone
# then ran from the battery with the cable attached, drained down to the
# resume level and charged up again, over and over. Left plugged in as a
# server that micro-cycled the cell, an estimated 80 to 175 equivalent full
# cycles a year. With charging_enabled the battery is idle while paused and
# only charges again if it drops to the lower limit.
#
# input_suspend is now only used on purpose by sweet-charge-drain, for the
# drain phase of the automatic calibration (see
# /usr/bin/droid/sweet-charge-calibration).
[Charging]
ControlPath=/sys/class/power_supply/battery/charging_enabled
EnableValue=1
DisableValue=0
