# See /usr/bin/droid/sweet-libprocessgroup-override.sh for why this is needed.
# ExecStartPre= in a drop-in appends to the list droid-configs-device already
# declares, so this runs after droid-hal-early-init.sh and before
# droid-hal-startup.sh starts the Android daemons.
[Service]
ExecStartPre=-/bin/sh /usr/bin/droid/sweet-libprocessgroup-override.sh
