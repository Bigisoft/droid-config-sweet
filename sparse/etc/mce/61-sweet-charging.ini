# sweet: point mce at the charge-control node that actually works.
#
# mce's charging module knows three candidate sysfs paths and picks
# battery_charging_enabled on this device. That node accepts writes and does
# nothing here - measured with the charger attached, writing 0 left current_now
# at -18310, i.e. still charging. Same for charging_enabled (-19531).
#
# Only input_suspend has any effect: setting it to 1 flipped current_now to
# +50354, the phone running off the battery. This is why the battery charge
# limit in Settings appeared to do nothing while it worked under LineageOS -
# Xiaomi's own stack drives input_suspend.
#
# Note the inverted polarity: input_suspend 1 = input suspended = charging off,
# so EnableValue/DisableValue are the other way round from charging_enabled.
[Charging]
ControlPath=/sys/class/power_supply/battery/input_suspend
EnableValue=0
DisableValue=1
