# Belt and braces. A droid-hal-init.service that sets PrivateTmp, ProtectSystem
# or ProtectHome runs in its own mount namespace, and MountFlags= is then
# ignored. On an Android 10+ base that is fatal: apexd mounts the APEX packages
# and generates /linkerconfig from inside init, so those mounts stay trapped and
# the UI cannot load hwcomposer.qcom.so.
# Measured on sweet with such a unit: 22 apex mounts in the droid-hal-init
# namespace, 0 in PID 1. Without the sandboxing: 22 in PID 1, and
# /linkerconfig/ld.config.txt appears.
#
# The unit droid-configs-device ships in sparse-16 already sets none of the
# three, so as long as %android_version_major is 16 this drop-in changes
# nothing. It is kept so that a base sparse unit, or a future rebase that
# reintroduces the sandboxing, cannot silently break the display again.
# The sandboxing buys little here in any case: the service runs as root and
# spawns the Android HAL daemons regardless.
[Service]
PrivateTmp=false
ProtectSystem=false
ProtectHome=false
