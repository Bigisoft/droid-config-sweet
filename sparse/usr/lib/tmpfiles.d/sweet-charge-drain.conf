# sweet: where the calibration (sweet-charge-calibration, run as the user)
# leaves its drain request for sweet-charge-drain. Group-writable for
# sailfish-system (the user is in it); setgid so the request file the user
# writes keeps that group. Root's own state is separate: RuntimeDirectory=
# of sweet-charge-drain.service. The spec's %post runs systemd-tmpfiles for
# this file, so it also exists right after an install without a reboot.
d /var/lib/sweet-charge-drain 2775 root sailfish-system -
