# sweet has two SIM slots. With two or more slots ofono's slot manager leaves
# the data SIM unset until the user picks one, unless AutoSelectDataSim is
# enabled here (default "off"; see ofono src/slot-manager.c). With it unset
# the data modem stays empty, the modem never attaches for data and connman
# never creates the cellular technology, so mobile data cannot be turned on.
# "always": pick the present SIM whenever no data SIM was chosen explicitly;
# an explicit choice in Settings still wins.
[ModemManager]
AutoSelectDataSim=always
