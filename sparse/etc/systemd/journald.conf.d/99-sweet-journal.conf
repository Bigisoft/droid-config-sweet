# sweet: keep the journal across reboots while the port is being brought up.
#
# Nearly every fault found on this device was diagnosed from journalctl, and
# several of them - the binder deadlocks in FIX 18 especially - only showed
# their cause in log lines written before a reboot or a daemon restart. The
# default volatile journal loses exactly that.
#
# Rate limiting is off because it silently drops lines, and a dropped line in
# the middle of a callback trace is worse than a slow log: sailfish-fpd-community
# in debug mode emits several lines per finger touch and tripped the default
# limit during enrolment.
#
# This is a bring-up setting, not a shipping one. For a release build, drop
# RateLimit* back to the defaults and consider Storage=volatile again; 64M is
# a deliberate cap so the journal cannot grow without bound in the meantime.
[Journal]
Storage=persistent
SystemMaxUse=64M
RateLimitIntervalSec=0
RateLimitBurst=0
