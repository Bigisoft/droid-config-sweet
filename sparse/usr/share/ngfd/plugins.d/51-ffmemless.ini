# sweet (Redmi Note 10 Pro) haptics for the aw8624 LRA.
#
# Two separate problems had to be solved here.
#
# 1. ngfd would not start at all. Its ffmemless plugin uploads FF effects, and
#    both stock types are rejected before the driver is even reached:
#      - rumble: input_ff_create() advertises FF_RUMBLE in dev->ffbit ("we can
#        emulate RUMBLE with periodic effects") but aw8624 never registers it,
#        so it is missing from ff->ffbit and ff-core's compat_effect() rewrites
#        it to FF_PERIODIC/FF_SINE with custom_data left NULL. The driver's
#        FF_PERIODIC path then does copy_from_user(custom_data) -> EFAULT.
#      - periodic + sine: ff-core validates the waveform against dev->ffbit and
#        the driver registers only FF_CUSTOM, so sine -> EINVAL.
#    Every upload failed, the sink failed to init and ngfd exited, taking every
#    haptic on the device with it.
#
# 2. Plain FF_CONSTANT starts ngfd but is imperceptible. The driver only ever
#    sets play.vmax_mv from a *periodic* upload and never reads
#    u.constant.level, so after boot vmax_mv is 0 and
#    aw8624_haptic_effect_strength() clamps the gain to 0x1e (23%). Combined
#    with the ~56% peak of loop waveform 11 that is ~13% of full scale - the
#    kernel log shows "effect_strength: aw8624->level =0x1e" and nothing is felt.
#
# So short effects use the vendor path instead: FF_PERIODIC with
# _WAVEFORM = custom and _CUSTOM = <n> selects RAM waveform n+1 and sets
# vmax_mv from _MAGNITUDE, giving full gain (0x80). This is exactly what the
# Android QTI vibrator HAL does for clicks.
#
# Long/repeating effects stay constant (RAM-loop waveform 11 for _DURATION ms).
# They inherit the gain from the last periodic upload, which is why every
# periodic _MAGNITUDE here must be 32767 - otherwise the long effects drop back
# to 0x1e and go silent again.
#
# cache_effects is mandatory: the driver keeps a single global effect state and
# aw8624_haptics_playback() ignores its effect_id argument, so without
# re-uploading immediately before each play every effect would fire as whichever
# one happened to be uploaded last.
#
# RAM waveform ids come from the device tree (wf_0..wf_9):
#   0 CLICK, 1 DOUBLE CLICK, 2 TICK, 3 THUD, 4 POP, 5 HEAVY CLICK
[ffmemless]
cache_effects = true

# The stock 50-ffmemless.ini has a typo in supported_effects:
# "drag_boundary_drag_end" instead of "drag_boundary;drag_end", so neither of
# those two effects was ever created. Restate the list correctly here.
supported_effects = touch;touch_weak;touch_strong;release;release_weak;release_strong;drag_start;drag_fail;drag_boundary;drag_end;short;strong;long;notice;message;attention;alarm;ringtone

touch_TYPE = periodic
touch_WAVEFORM = custom
touch_CUSTOM = 0
touch_MAGNITUDE = 32767

touch_weak_TYPE = periodic
touch_weak_WAVEFORM = custom
touch_weak_CUSTOM = 2
touch_weak_MAGNITUDE = 32767

touch_strong_TYPE = periodic
touch_strong_WAVEFORM = custom
touch_strong_CUSTOM = 5
touch_strong_MAGNITUDE = 32767

release_TYPE = periodic
release_WAVEFORM = custom
release_CUSTOM = 2
release_MAGNITUDE = 32767

release_weak_TYPE = periodic
release_weak_WAVEFORM = custom
release_weak_CUSTOM = 2
release_weak_MAGNITUDE = 32767

release_strong_TYPE = periodic
release_strong_WAVEFORM = custom
release_strong_CUSTOM = 5
release_strong_MAGNITUDE = 32767

drag_start_TYPE = periodic
drag_start_WAVEFORM = custom
drag_start_CUSTOM = 2
drag_start_MAGNITUDE = 32767

drag_fail_TYPE = periodic
drag_fail_WAVEFORM = custom
drag_fail_CUSTOM = 2
drag_fail_MAGNITUDE = 32767

drag_boundary_TYPE = periodic
drag_boundary_WAVEFORM = custom
drag_boundary_CUSTOM = 2
drag_boundary_MAGNITUDE = 32767

drag_end_TYPE = periodic
drag_end_WAVEFORM = custom
drag_end_CUSTOM = 2
drag_end_MAGNITUDE = 32767

short_TYPE = periodic
short_WAVEFORM = custom
short_CUSTOM = 0
short_MAGNITUDE = 32767

strong_TYPE = periodic
strong_WAVEFORM = custom
strong_CUSTOM = 5
strong_MAGNITUDE = 32767

# Long / repeating patterns: RAM-loop waveform 11 for _DURATION ms.
long_TYPE = constant
notice_TYPE = constant
message_TYPE = constant
attention_TYPE = constant
alarm_TYPE = constant
ringtone_TYPE = constant
