# sweet (Redmi Note 10 Pro) haptics override for the aw8624 LRA.
#
# The stock 50-ffmemless.ini uses rumble and periodic/sine effects. Neither
# reaches this driver:
#
#  - FF_RUMBLE: input_ff_create() advertises FF_RUMBLE in dev->ffbit ("we can
#    emulate RUMBLE with periodic effects") but the driver never registers it,
#    so it is absent from ff->ffbit and ff-core's compat_effect() rewrites the
#    effect to FF_PERIODIC/FF_SINE, leaving custom_data NULL. The aw8624
#    FF_PERIODIC path then does copy_from_user(custom_data) -> EFAULT.
#  - FF_PERIODIC + sine: ff-core validates the waveform against dev->ffbit and
#    the driver only registers FF_CUSTOM, so it is rejected with EINVAL before
#    the driver is even called.
#
# Every upload therefore fails, ffmemless reports "Could not load ngfd effects"
# and ngfd aborts at startup - which is why the device had no vibration at all.
#
# FF_CONSTANT is in both bitmaps, so it reaches the driver unconverted and maps
# to its RAM-loop (CONT) path, which is the mode that actually drives this LRA.
#
# cache_effects is required: the driver keeps a single global effect state and
# aw8624_haptics_playback() ignores its effect_id argument, so without
# re-uploading immediately before each play every effect would play as whichever
# one was uploaded last.
[ffmemless]
cache_effects = true

touch_TYPE = constant
touch_LEVEL = 24000
touch_weak_TYPE = constant
touch_weak_LEVEL = 20000
touch_strong_TYPE = constant
touch_strong_LEVEL = 30000
release_TYPE = constant
release_LEVEL = 24000
release_weak_TYPE = constant
release_weak_LEVEL = 20000
release_strong_TYPE = constant
release_strong_LEVEL = 30000
drag_start_TYPE = constant
drag_start_LEVEL = 25000
drag_fail_TYPE = constant
drag_fail_LEVEL = 25000
drag_boundary_TYPE = constant
drag_boundary_LEVEL = 25000
drag_end_TYPE = constant
drag_end_LEVEL = 25000
short_TYPE = constant
short_LEVEL = 24000
strong_TYPE = constant
strong_LEVEL = 32767
long_TYPE = constant
long_LEVEL = 24000
notice_TYPE = constant
notice_LEVEL = 32767
message_TYPE = constant
message_LEVEL = 27000
attention_TYPE = constant
attention_LEVEL = 32767
alarm_TYPE = constant
alarm_LEVEL = 32767
ringtone_TYPE = constant
ringtone_LEVEL = 32767
